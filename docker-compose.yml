# AMS stack: Postgres, Redis, API, Celery worker + beat, and the web app (nginx), which serves
# the UI and forwards /api to the API, so one port serves everything.
#
# Settings are compose variables, not files: put them in a `.env` file next to this one (copy
# `.env.example`), or enter them as environment variables in Portainer. Only AMS_SECRET_KEY is
# required; see .env.example for the rest.
#
#   cp .env.example .env              # set AMS_SECRET_KEY (and AMS_DB_PASSWORD)
#   docker compose up -d --build
#
# Web + API: http://localhost:3001   (API docs: http://localhost:3001/api/v1/docs)
#
# Wearables: Open Wearables runs separately (dial203/open-wearables). Set OW_BASE_URL and
# OW_API_KEY; register an OW outgoing webhook at <AMS_PUBLIC_URL>/api/v1/integrations/open-wearables/webhook
# and put its signing secret (whsec_...) in OW_WEBHOOK_SECRET.

x-api-env: &api_env
  DATABASE_URL: postgresql+psycopg://ams:${AMS_DB_PASSWORD:-ams}@db:5432/ams
  REDIS_URL: redis://redis:6379/0
  AMS_SECRET_KEY: ${AMS_SECRET_KEY:?Set AMS_SECRET_KEY to 32+ random characters, e.g. the output of `openssl rand -hex 32`}
  # The address people open in a browser; used in invitation links
  WEB_BASE_URL: ${AMS_PUBLIC_URL:-http://localhost:3001}
  CORS_ORIGINS: ${AMS_PUBLIC_URL:-http://localhost:3001},http://localhost:5173
  AMS_UPLOAD_DIR: /data/uploads
  # Open Wearables (optional; wearable screens say "not set up" until OW_BASE_URL and OW_API_KEY are set)
  OW_BASE_URL: ${OW_BASE_URL:-}
  OW_API_KEY: ${OW_API_KEY:-}
  OW_PUBLIC_BASE_URL: ${OW_PUBLIC_BASE_URL:-}
  OW_APP_ID: ${OW_APP_ID:-}
  OW_APP_SECRET: ${OW_APP_SECRET:-}
  OW_WEBHOOK_SECRET: ${OW_WEBHOOK_SECRET:-}
  EXPO_PUSH_ENABLED: ${EXPO_PUSH_ENABLED:-false}
  # First-start setup, applied by the API container on every start and only adding what is missing
  AMS_SEED_DEMO: ${AMS_SEED_DEMO:-false}
  AMS_DEMO_PASSWORD: ${AMS_DEMO_PASSWORD:-demo-password-change-me}
  AMS_ORG_NAME: ${AMS_ORG_NAME:-}
  AMS_ORG_TIMEZONE: ${AMS_ORG_TIMEZONE:-UTC}
  AMS_ADMIN_EMAIL: ${AMS_ADMIN_EMAIL:-}
  AMS_ADMIN_PASSWORD: ${AMS_ADMIN_PASSWORD:-}
  AMS_ADMIN_NAME: ${AMS_ADMIN_NAME:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: ams
      # Only takes effect when the volume is first created
      POSTGRES_PASSWORD: ${AMS_DB_PASSWORD:-ams}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ams_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./api
    pull_policy: build
    restart: unless-stopped
    environment: *api_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ams_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./api
    pull_policy: build
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO"]
    environment: *api_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ams_uploads:/data/uploads
    depends_on:
      - api
      - redis

  beat:
    build: ./api
    pull_policy: build
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *api_env
    depends_on:
      - api
      - redis

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # "/" = same origin (nginx forwards /api to the api service)
        VITE_API_URL: ${VITE_API_URL:-/}
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${AMS_WEB_PORT:-3001}:80"
    depends_on:
      - api

volumes:
  ams_db:
  ams_uploads:
