# Local development stack for AMS. Open Wearables runs from its own repository
# (dial203/open-wearables) with its own compose file; point OW_BASE_URL at it.
# On the same machine, the default http://host.docker.internal:8000 reaches OW's API.
#
#   cp api/.env.example api/.env      # set OW_API_KEY etc.
#   docker compose up -d
#   docker compose exec api uv run python -m app.cli seed-demo
#
# Web: http://localhost:3001   API: http://localhost:8001/api/v1/docs

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ams
    ports:
      - "${AMS_DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ams_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  api:
    build: ./api
    env_file: ./api/.env
    environment: &api_env
      DATABASE_URL: postgresql+psycopg://ams:ams@db:5432/ams
      REDIS_URL: redis://redis:6379/0
      OW_BASE_URL: ${OW_BASE_URL:-http://host.docker.internal:8000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3001","http://localhost:5173"]}
      AMS_UPLOAD_DIR: /data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AMS_API_PORT:-8001}:8000"
    volumes:
      - ams_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./api
    command: ["uv", "run", "celery", "-A", "app.worker", "worker", "--loglevel=info"]
    env_file: ./api/.env
    environment: *api_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ams_uploads:/data/uploads
    depends_on:
      - api
      - redis

  beat:
    build: ./api
    command: ["uv", "run", "celery", "-A", "app.worker", "beat", "--loglevel=info"]
    env_file: ./api/.env
    environment: *api_env
    depends_on:
      - api
      - redis

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    ports:
      - "${AMS_WEB_PORT:-3001}:80"
    depends_on:
      - api

volumes:
  ams_db:
  ams_uploads:
