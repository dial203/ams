server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same-origin API: the browser calls /api/v1 on this server and nginx forwards it to the API
  # container, so the web build needs no API address and no CORS. Docker's DNS is resolved per
  # request, so nginx starts even before the API container is up.
  resolver 127.0.0.11 valid=30s ipv6=off;
  location /api/ {
    set $ams_api http://api:8000;
    proxy_pass $ams_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 25m;
  }

  # Hashed assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: every other path serves index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri /index.html;
  }
}
