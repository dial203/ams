[project]
name = "ams-api"
version = "0.1.0"
description = "AMS athlete management system API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "celery[redis]>=5.4",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "email-validator>=2.2",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
    "time-machine>=2.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "ANN"]
ignore = ["B008", "RUF012", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
